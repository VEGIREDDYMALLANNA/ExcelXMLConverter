name: ExcelXMLConverter CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Verify Python
        run: |
          python --version

      - name: Build application
        run: |
          python -m PyInstaller --onefile --windowed --icon=src/excelxml.ico --add-data "src/excelxml.ico;." --name ExcelXMLConverter src/main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelXMLConverter
          path: dist/ExcelXMLConverter.exe